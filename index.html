<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#f5f5f7" />

  <title>MyPhotoPond</title>

  <link rel="icon" type="image/jpeg" href="Web-icon.JPEG">
  <link rel="apple-touch-icon" href="Web-icon.JPEG">

  <link rel="stylesheet" href="style.css" />
</head>

<body>
  <main class="wrap" role="main">
    <header class="header">
      <div class="brand-mark" aria-hidden="true"></div>

      <h1 class="title">MyPhotoPond</h1>
      <p class="subtitle">jump in pond</p>
    </header>

    <section class="pond-card" aria-label="Pond links">
      <div class="buttons">

        <!-- Matter+ hides the secret album beneath it -->
        <div class="secret-album" id="secretAlbum">
          <a
            class="pond-btn black secret-zero"
            href="https://www.icloud.com/sharedalbum/#B2N5M7GFPpViJO"
            target="_blank"
            rel="noopener"
            aria-label="0"
          >
            <span>0</span>
            <span class="button-arrow" aria-hidden="true">↗</span>
          </a>

          <a
            class="pond-btn red secret-cover"
            href="https://www.icloud.com/sharedalbum/#B2XGWZuqD1HOyu1"
            target="_blank"
            rel="noopener"
          >
            <span>Matter+</span>
            <span class="button-arrow" aria-hidden="true">↗</span>
          </a>
        </div>

        <a
          class="pond-btn blue"
          href="https://www.icloud.com/sharedalbum/#B2NGFssfGGkRxtD"
          target="_blank"
          rel="noopener"
        >
          <span>Shiragi By Nihu</span>
          <span class="button-arrow" aria-hidden="true">↗</span>
        </a>

        <a
          class="pond-btn pink"
          href="https://www.icloud.com/sharedalbum/#B2BJtdOXm2im6JE"
          target="_blank"
          rel="noopener"
        >
          <span>DOLLBLUSH</span>
          <span class="button-arrow" aria-hidden="true">↗</span>
        </a>

        <a
          class="pond-btn yellow"
          href="https://www.icloud.com/sharedalbum/#B2N5fk75vbcCJh"
          target="_blank"
          rel="noopener"
        >
          <span>Starstuff</span>
          <span class="button-arrow" aria-hidden="true">↗</span>
        </a>

        <a
          class="pond-btn purple"
          href="https://www.icloud.com/sharedalbum/#B2XG4Tcsm1IqvBE"
          target="_blank"
          rel="noopener"
        >
          <span>Sauna</span>
          <span class="button-arrow" aria-hidden="true">↗</span>
        </a>

        <a
          class="pond-btn orange"
          href="https://www.icloud.com/sharedalbum/#B2NGRMtznGBEq5a"
          target="_blank"
          rel="noopener"
        >
          <span>ProjectSoon</span>
          <span class="button-arrow" aria-hidden="true">↗</span>
        </a>

        <a
          class="pond-btn light-pink"
          href="https://www.icloud.com/sharedalbum/#B2NGQOeMmGuhjgr"
          target="_blank"
          rel="noopener"
        >
          <span>Alice Robins</span>
          <span class="button-arrow" aria-hidden="true">↗</span>
        </a>

        <a
          class="pond-btn green"
          href="https://www.icloud.com/sharedalbum/#B2N5ejO17Q3f7V"
          target="_blank"
          rel="noopener"
        >
          <span>Ella</span>
          <span class="button-arrow" aria-hidden="true">↗</span>
        </a>
      </div>
    </section>

    <nav class="back-area" aria-label="Return navigation">
      <a class="back-button" href="https://skylark-inc.github.io">

    <footer class="footer">

          <a

            rel="noopener"
          >
            @MyPhotoPond
          </a>
          for more info.
        </span>
      </div>
    </footer>
  </main>

  <script>
    (() => {
      const secretAlbum = document.getElementById("secretAlbum");
      const cover = secretAlbum?.querySelector(".secret-cover");

      if (!secretAlbum || !cover) return;

      let startX = 0;
      let startY = 0;
      let currentX = 0;
      let dragging = false;
      let horizontalGesture = false;
      let suppressClick = false;

      const revealAlbum = () => {
        secretAlbum.classList.add("revealed");

        cover.style.removeProperty("transform");
        cover.style.removeProperty("opacity");
        cover.style.removeProperty("transition");
      };

      const resetCover = () => {
        cover.style.removeProperty("transform");
        cover.style.removeProperty("opacity");
        cover.style.removeProperty("transition");
      };

      cover.addEventListener("pointerdown", event => {
        if (secretAlbum.classList.contains("revealed")) return;

        startX = event.clientX;
        startY = event.clientY;
        currentX = 0;
        dragging = true;
        horizontalGesture = false;
        suppressClick = false;

        cover.setPointerCapture(event.pointerId);
        cover.style.transition = "none";
      });

      cover.addEventListener("pointermove", event => {
        if (!dragging) return;

        const deltaX = event.clientX - startX;
        const deltaY = event.clientY - startY;

        if (!horizontalGesture) {
          if (Math.abs(deltaX) < 7 && Math.abs(deltaY) < 7) return;

          if (Math.abs(deltaY) > Math.abs(deltaX)) {
            dragging = false;
            resetCover();
            return;
          }

          horizontalGesture = true;
        }

        if (deltaX >= 0) {
          currentX = 0;
          return;
        }

        currentX = deltaX;
        suppressClick = Math.abs(deltaX) > 10;

        const width = cover.offsetWidth || 240;
        const progress = Math.min(Math.abs(deltaX) / width, 1);

        cover.style.transform = `translate3d(${deltaX}px, 0, 0)`;
        cover.style.opacity = String(1 - progress * 0.38);
      });

      cover.addEventListener("pointerup", event => {
        if (!dragging && !horizontalGesture) return;

        dragging = false;

        if (cover.hasPointerCapture(event.pointerId)) {
          cover.releasePointerCapture(event.pointerId);
        }

        cover.style.transition = "";

        const threshold = Math.min(80, cover.offsetWidth * 0.28);

        if (currentX <= -threshold) {
          suppressClick = true;
          revealAlbum();
        } else {
          resetCover();
        }
      });

      cover.addEventListener("pointercancel", () => {
        dragging = false;
        horizontalGesture = false;
        suppressClick = false;
        resetCover();
      });

      cover.addEventListener("click", event => {
        if (suppressClick) {
          event.preventDefault();
          event.stopPropagation();
          suppressClick = false;
        }
      });
    })();
  </script>
</body>
</html>
